mode: train
sudoku:
  output_dir: ${cwd:}/sudoku_eval
  batch_size: 64
gsm8k:
  input_file: null
  output_dir: ${cwd:}/gsm8k_eval
  timeout: 5.0
  bootstrap_size: 1
seed: 1
allow_tf32: true
cudnn_benchmark: true
compile_backbone: false
backbone_compute_dtype: float32
neg_infinity_mode: large-finite
loader:
  global_batch_size: 8
  eval_global_batch_size: 8
  batch_size: 8
  eval_batch_size: 8
  num_workers: 4
  pin_memory: true
confidence_denoiser:
  confidence_score: entropy
  gamma: 0
training:
  ema: 0
  antithetic_sampling: true
  importance_sampling: false
  sampling_eps: 0.001
  change_of_variables: false
  loss_precision: bf16
  finetune_path: /root/autodl-tmp/s-flm/checkpoints/tinygsm/mdlm.ckpt
  finetune_weights: ema
  sampling_eps_min: 0.001
  sampling_eps_max: 1.0
  resample: false
lora:
  enabled: true
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules:
  - blocks.*.attn_qkv
  - blocks.*.attn_out
  - blocks.*.mlp.0
  - blocks.*.mlp.2
eval:
  checkpoint_path: ''
  strict_loading: true
  disable_ema: false
  compute_generative_perplexity: false
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: false
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: false
  generated_samples_path: ${cwd:}/samples.json
  results_json_path: null
optim:
  weight_decay: 0
  lr: 3.0e-06
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: 1
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices}
    * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: bf16-mixed
  num_sanity_val_steps: 1
  max_steps: -1
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  max_epochs: 1
wandb:
  project: s-flm
  notes: null
  group: mdlm-gsm8k-pot
  job_type: sft
  tags:
  - mdlm
  - gsm8k-pot
  - sft
  - lora
  - base-aligned
  - control
  name: mdlm-sft-lora-control-${now:%Y%m%d-%H%M%S}
  save_dir: ${cwd:}
  offline: false
  log_model: false
  id: null
checkpointing:
  save_dir: ${cwd:}
  resume_from_ckpt: false
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
callbacks:
  checkpoint_every_n_steps:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    save_top_k: 0
    save_last: false
    dirpath: ${checkpointing.save_dir}/checkpoints
    verbose: true
    auto_insert_metric_name: false
    every_n_train_steps: 0
  checkpoint_monitor:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/nll
    mode: min
    save_top_k: 0
    save_last: false
    dirpath: ${checkpointing.save_dir}/checkpoints
    filename: best
    auto_insert_metric_name: false
    verbose: true
  milestone_checkpoint:
    _target_: callbacks.milestone_checkpoint.MilestoneCheckpoint
    milestones:
    - 100
    - 200
    - 711
    dirpath: ${checkpointing.save_dir}/checkpoints
    filename: step-{step:06d}.ckpt
data:
  train: gsm8k_pot
  valid: gsm8k_pot
  train_file: ${hydra:runtime.cwd}/data/gsm8k_pot/sft_train.jsonl
  validation_file: ${hydra:runtime.cwd}/data/gsm8k_pot/sft_validation.jsonl
  cache_dir: ${hydra:runtime.cwd}/data_cache/gsm8k_pot
  tokenizer_name_or_path: HuggingFaceTB/SmolLM-135M
  tokenizer_revision: 1d461723eec654e65efdc40cf49301c89c0c92f4
  separator: \n
  wrap: false
  streaming: false
  insert_train_eos: true
  insert_valid_eos: true
  train_on_prompt: false
  train_on_pad: true
model:
  name: small
  type: dit
  hidden_size: 768
  cond_dim: 128
  length: 512
  n_blocks: 12
  n_heads: 12
  dropout: 0.1
strategy:
  _target_: lightning.pytorch.strategies.SingleDeviceStrategy
  device: cuda:0
noise:
  type: log-linear
  eps: 0.001
  alpha_min: null
  alpha_max: null
  adaptive: false
lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  num_warmup_steps: 20
prior:
  type: none
  latent_width: 0
  latent_height: 0
algo:
  name: mdlm
  diffusion_type: absorbing
  backbone: dit
  parameterization: subs
  time_conditioning: false
  T: 0
  causal_attention: false
  loss_type: elbo
  post_process_mode: log_probs
  adaLN: true
sampler:
  predictor: ancestral
  steps: 1024
  steps_policy: full
  noise_removal: ancestral
  use_float64: true
  p_nucleus: 1.0
  temperature: 1.0
  num_sample_batches: 2
  num_sample_log: 2
sft_monitoring: true

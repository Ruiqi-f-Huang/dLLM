hydra:
  run:
    dir: /root/autodl-tmp/s-flm/outputs/selftrain-pilot-20261023-01/train-original
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/root/autodl-tmp/s-flm/outputs/selftrain-pilot-20261023-01/train-original
    - hydra.mode=RUN
    task:
    - training.finetune_path=/root/s-flm/checkpoints/tinygsm/mdlm.ckpt
    - data.train_file=/root/s-flm/data/gsm8k_pot_selftrain_pilot/sft_train_original.jsonl
    - data.validation_file=/root/s-flm/data/gsm8k_pot/sft_validation.jsonl
    - data.cache_dir=/root/s-flm/data_cache/gsm8k_pot
    - wandb.id=stp23w0original
    - wandb.name=selftrain-original-200
    - +trainer.enable_progress_bar=false
  job:
    name: main
    chdir: true
    override_dirname: +trainer.enable_progress_bar=false,data.cache_dir=/root/s-flm/data_cache/gsm8k_pot,data.train_file=/root/s-flm/data/gsm8k_pot_selftrain_pilot/sft_train_original.jsonl,data.validation_file=/root/s-flm/data/gsm8k_pot/sft_validation.jsonl,training.finetune_path=/root/s-flm/checkpoints/tinygsm/mdlm.ckpt,wandb.id=stp23w0original,wandb.name=selftrain-original-200
    id: ???
    num: ???
    config_name: sft-selftrain-pilot
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/s-flm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/s-flm/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/s-flm/outputs/selftrain-pilot-20261023-01/train-original
    choices:
      sampler: ancestral
      algo: mdlm
      prior: none
      lr_scheduler: constant_warmup
      noise: log-linear
      strategy: single-device
      model: small
      data: gsm8k-pot
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
